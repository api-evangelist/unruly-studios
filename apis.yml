name: Unruly Studios
description: >-
  Unruly Studios makes Unruly Splats, programmable stompable floor buttons that
  teach children to code through active, physical STEM play. Students use a
  tablet or computer app to program Splats to light up, make sounds, and score
  points, building games, dance competitions, and math activities they play
  together in classrooms and gyms. Founded in 2015 in Boston by Bryanne Leeming
  and backed by Techstars, the Amazon Alexa Fund, AT&T, eCoast Angels, and
  LearnLaunch. Unruly's only machine API surface is an internal "Gamelocker"
  project store, a self-hosted GitLab instance that saves kids' coding projects
  as GitLab repositories and exposes GitLab's OAuth 2.0 / OpenID Connect and
  v4 REST API.
