apis:
- name: Unruly Gamelocker API
  description: >-
    The Gamelocker backend (gamelocker.unruly-studios.com) is a self-hosted
    GitLab instance that stores each learner's coding "profiles" and game files
    as GitLab projects and repository files. It exposes GitLab's standard v4
    REST API and OAuth 2.0 / OpenID Connect authorization server. This is an
    internal backing service consumed by the Unruly Splats app, not a
    documented public developer API.
  humanURL: https://status.unrulysplats.com/
  baseURL: https://gamelocker.unruly-studios.com/api/v4
