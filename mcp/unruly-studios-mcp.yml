- name: update_profile
  description: Rename or update a profile's description.
  maps_to: PUT /projects/{id}
- name: delete_profile
  description: Delete a coding profile.
  maps_to: DELETE /projects/{id}
- name: commit_files
  description: Create, update, or delete game files in a profile via a commit.
